# Pre-commit hooks for ShieldClaw.
#
# Install:  pip install pre-commit  &&  pre-commit install
# Run all:  pre-commit run --all-files
#
# The Python package lives under shield-claw/; the local hooks use small
# launcher scripts (shield-claw/scripts/pre_commit_*.py) so they work
# cross-platform without requiring bash.

repos:
  # ---------------------------------------------------------------------------
  # Ruff — formatter + linter (official pre-commit hooks)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
        files: ^shield-claw/
      - id: ruff
        args: [--fix]
        files: ^shield-claw/

  # ---------------------------------------------------------------------------
  # Local hooks — use Python launcher scripts; no bash dependency.
  # Requires the dev venv to be active (language: system).
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        language: system
        # Launcher chdirs to shield-claw/ so pyproject.toml [tool.mypy] is used.
        entry: python shield-claw/scripts/pre_commit_mypy.py
        pass_filenames: false
        types: [python]

      - id: pytest-unit
        name: pytest (unit — no Docker)
        language: system
        # Launcher chdirs to shield-claw/ so pyproject.toml [tool.pytest] is used.
        # --no-cov requires pytest-cov in requirements-dev.txt.
        entry: python shield-claw/scripts/pre_commit_pytest.py
        pass_filenames: false
        types: [python]
