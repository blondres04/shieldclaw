name: CI

on:
  push:
    branches:
      - main
      - pivot/sast-verifier
      - "phase-*/**"
  pull_request:
    branches:
      - main
      - pivot/sast-verifier

jobs:
  quality:
    name: quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shield-claw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            shield-claw/requirements.txt
            shield-claw/requirements-dev.txt

      - name: install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -e .

      - name: ruff format check
        run: ruff format --check .

      - name: ruff lint
        run: ruff check .

      - name: mypy
        run: mypy src/

      - name: pytest (unit — no Docker required)
        run: pytest tests/ -m "not integration" -q
